<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlanPad Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#17181D;--s:#23252D;--s2:#2C2F38;--b:#353844;--lime:#C8F53C;--ink:#14160F;--t:#F4F5F7;--m:#A3A9B8;--err:#FF9A90}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:400 15px/1.45 "Google Sans","DM Sans",system-ui,sans-serif}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
[hidden]{display:none!important}
.m{color:var(--m);font-size:13px}
button,select,input{font:inherit;color:var(--t)}
.btn{background:var(--lime);color:var(--ink);border:0;border-radius:99px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5}
.ghost{background:var(--s2);border:0;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.x{background:none;border:0;color:var(--err);cursor:pointer;font-size:14px;padding:4px 8px}
.x:disabled{opacity:.25;cursor:default}
select,input{background:var(--bg);border:1px solid var(--b);border-radius:12px;padding:9px 12px;min-width:0}
select:disabled{opacity:.5}
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
#login form{width:100%;max-width:380px;display:grid;gap:12px}
#login h1{font-size:34px;font-weight:700}
.err{color:var(--err);font-size:13px;min-height:18px}
header.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 28px;border-bottom:1px solid var(--b)}
.brand{font-weight:700;font-size:20px}
.tabs{display:flex;background:var(--s);border-radius:99px;padding:4px}
.tabs button{background:none;border:0;border-radius:99px;padding:8px 20px;font-weight:700;color:var(--m);cursor:pointer}
.tabs button.on{background:var(--lime);color:var(--ink)}
main{max-width:1120px;margin:0 auto;padding:28px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.bar h2{font-size:26px}
.tw{overflow-x:auto;background:var(--s);border-radius:22px;padding:6px 18px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;color:var(--m);font-weight:500;font-size:13px;padding:12px 8px}
td{padding:12px 8px;border-top:1px solid var(--b)}
td.act{display:flex;gap:8px;flex-wrap:wrap}
.pill{border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.on{background:#173A28;color:#8BE0A4}.pill.off{background:var(--s2);color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--s);border-radius:22px;padding:18px;display:grid;gap:12px;align-content:start}
.card.arch{opacity:.6}
.card header{display:flex;justify-content:space-between;gap:12px}
.card h3{font-size:19px}
.mem{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mem li{display:flex;align-items:center;gap:8px}
.mem li span{flex:1;font-weight:500}
.addrow{display:flex;gap:8px}
.addrow select:first-child{flex:1}
details summary{cursor:pointer;font-weight:700}
.tk{display:flex;flex-direction:column;padding:8px 0;border-top:1px solid var(--b);margin-top:8px}
.card footer{display:flex;justify-content:flex-end}
dialog{background:var(--s);color:var(--t);border:0;border-radius:22px;padding:24px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog form{display:grid;gap:14px}
dialog label{display:grid;gap:6px;font-size:13px;color:var(--m);font-weight:700}
dialog .row{display:flex;justify-content:flex-end;gap:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--s2);padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media(max-width:600px){main{padding:18px}header.top{padding:14px 18px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head>
<body>
<section id="login" hidden>
 <form id="loginForm">
  <h1>PlanPad Admin</h1>
  <p class="m">Sign in with an admin account to manage users and projects.</p>
  <input id="email" type="email" placeholder="Email" autocomplete="username" required>
  <input id="pass" type="password" placeholder="Password" autocomplete="current-password" required>
  <p class="err" id="loginErr"></p>
  <button class="btn">Sign in</button>
 </form>
</section>

<div id="app" hidden>
 <header class="top">
  <span class="brand">PlanPad Admin</span>
  <nav class="tabs" aria-label="Sections"><button data-tab="users">Users</button><button data-tab="projects">Projects</button></nav>
  <div><span class="m" id="me"></span> <button class="ghost" id="out">Sign out</button></div>
 </header>
 <main id="view"></main>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword,updateProfile,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,onSnapshot,serverTimestamp,arrayUnion,arrayRemove,deleteField} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// 1. Paste your web app config from Firebase Console > Project settings > Your apps
const config = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "task-manager-ecb40.firebaseapp.com",
  projectId: "task-manager-ecb40",
  appId: "PASTE_YOUR_APP_ID"
};

const app = initializeApp(config), auth = getAuth(app), db = getFirestore(app);
// Second app instance: creating a user signs that user in, so it must not touch the admin's session
const secAuth = getAuth(initializeApp(config, "secondary"));

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const by = k => (a, b) => String(a[k] || "").localeCompare(String(b[k] || ""), undefined, {sensitivity: "base"});
const ROLES = ["manager", "dev", "test"], APP_ROLES = ["admin", "manager", "member"];
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : "";
const stat = s => cap(String(s || "").replace("_", " "));
const opts = (list, sel) => list.map(o => `<option value="${o}" ${o === sel ? "selected" : ""}>${cap(o)}</option>`).join("");

let me = null, users = [], projects = [], tasks = [], tab = "users", unsubs = [], pend = {}, openP = new Set();

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove("show"), 3200); }
function msg(e) {
  const c = e.code || "";
  if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return "Email or password is incorrect.";
  if (c.includes("email-already-in-use")) return "That email already has an account.";
  if (c.includes("weak-password")) return "Password must be at least 6 characters.";
  if (c.includes("permission-denied")) return "Firestore rules refused this change. Check the rules from the guide.";
  if (c.includes("too-many-requests")) return "Too many attempts. Try again later.";
  return e.message || "Something went wrong.";
}

// ---------- Sign in ----------
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("#email").value.trim(), $("#pass").value); }
  catch (err) { $("#loginErr").textContent = msg(err); }
};
$("#out").onclick = () => signOut(auth);

onAuthStateChanged(auth, async u => {
  unsubs.forEach(f => f()); unsubs = [];
  if (!u) { $("#app").hidden = true; $("#login").hidden = false; return; }
  try {
    const d = (await getDoc(doc(db, "users", u.uid))).data();
    if (!d || d.appRole !== "admin" || d.isActive === false) {
      await signOut(auth); $("#loginErr").textContent = "This page is for admins only."; return;
    }
    me = {id: u.uid, ...d};
    $("#login").hidden = true; $("#app").hidden = false; $("#me").textContent = me.email;
    const sub = (name, fn) => unsubs.push(onSnapshot(collection(db, name), s => { fn(s.docs.map(x => ({id: x.id, ...x.data()}))); render(); }, e => toast(msg(e))));
    sub("users", l => users = l.sort(by("name")));
    sub("projects", l => projects = l.sort(by("name")));
    sub("tasks", l => tasks = l);
  } catch (err) { await signOut(auth); $("#loginErr").textContent = msg(err); }
});

// ---------- Views ----------
function render() {
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("#view").innerHTML = tab === "users" ? usersView() : projectsView();
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });

const usersView = () => `
<div class="bar"><h2>Users <span class="m">${users.length}</span></h2><button class="btn" data-a="addUser">Add user</button></div>
<div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>App role</th><th>Status</th><th></th></tr></thead><tbody>
${users.map(u => { const self = u.id === me.id, off = u.isActive === false; return `<tr>
<td>${esc(u.name)}</td><td>${esc(u.email)}</td>
<td><select data-a="role" data-id="${u.id}" ${self ? "disabled" : ""} aria-label="App role">${opts(APP_ROLES, u.appRole)}</select></td>
<td><span class="pill ${off ? "off" : "on"}">${off ? "Inactive" : "Active"}</span></td>
<td class="act"><button class="ghost" data-a="reset" data-id="${u.id}">Send reset email</button>
${self ? "" : `<button class="ghost" data-a="toggle" data-id="${u.id}">${off ? "Activate" : "Deactivate"}</button>`}</td></tr>`; }).join("")}
</tbody></table></div>`;

function card(p) {
  const mem = p.members || {};
  const open = tasks.filter(t => t.projectId === p.id && !t.isDeleted && t.status !== "done" && t.status !== "cancelled").sort((a, b) => (a.priorityRank || 9) - (b.priorityRank || 9));
  const bugs = open.filter(t => t.type === "bug").length;
  const cand = users.filter(u => u.isActive !== false && !mem[u.id]);
  const pd = pend[p.id] || {uid: "", role: "dev"};
  return `<article class="card ${p.isArchived ? "arch" : ""}">
<header><div><h3>${esc(p.name)}</h3><p class="m">${esc(p.description)}</p></div><span class="m">${open.length} open · ${bugs} ${bugs === 1 ? "bug" : "bugs"}</span></header>
<ul class="mem">${Object.entries(mem).map(([uid, role]) => `<li><span>${esc(users.find(x => x.id === uid)?.name || "Unknown")}</span>
<select data-a="mrole" data-p="${p.id}" data-id="${uid}" aria-label="Project role">${opts(ROLES, role)}</select>
<button class="x" data-a="rmMem" data-p="${p.id}" data-id="${uid}" ${uid === p.createdBy ? "disabled" : ""} aria-label="Remove member">✕</button></li>`).join("")}</ul>
<div class="addrow"><select data-a="pickUser" data-p="${p.id}" aria-label="User to add"><option value="">Add member…</option>${cand.map(u => `<option value="${u.id}" ${u.id === pd.uid ? "selected" : ""}>${esc(u.name)}</option>`).join("")}</select>
<select data-a="pickRole" data-p="${p.id}" aria-label="Role">${opts(ROLES, pd.role)}</select><button class="ghost" data-a="addMem" data-p="${p.id}">Add</button></div>
<details data-p="${p.id}" ${openP.has(p.id) ? "open" : ""}><summary>Open tasks (${open.length})</summary>
${open.map(t => `<div class="tk"><span>${esc(t.title)}</span><span class="m">${esc(t.assigneeName || "Unassigned")} · ${esc(stat(t.status))} · ${esc(cap(t.priority))}${t.type === "bug" ? " · Bug" : ""}</span></div>`).join("") || '<p class="m">No open tasks.</p>'}</details>
<footer><button class="ghost" data-a="archive" data-p="${p.id}">${p.isArchived ? "Restore" : "Archive"}</button></footer></article>`;
}
const projectsView = () => `
<div class="bar"><h2>Projects <span class="m">${projects.length}</span></h2><button class="btn" data-a="addProject">New project</button></div>
<div class="grid">${projects.map(card).join("") || '<p class="m">No projects yet. Create the first one.</p>'}</div>`;

// ---------- Dialog ----------
function ask(title, fields, label, fn) {
  const d = $("#dlg");
  d.innerHTML = `<form><h3>${title}</h3>${fields.map(f => `<label>${f.l}${f.o ? `<select name="${f.n}">${opts(f.o)}</select>` : `<input name="${f.n}" type="${f.t || "text"}" ${f.min ? `minlength="${f.min}"` : ""} ${f.opt ? "" : "required"}>`}</label>`).join("")}
<p class="err" id="derr"></p><div class="row"><button type="button" class="ghost" id="dno">Cancel</button><button class="btn" id="dok">${label}</button></div></form>`;
  d.showModal();
  $("#dno").onclick = () => d.close();
  d.querySelector("form").onsubmit = async e => {
    e.preventDefault(); const b = $("#dok"); b.disabled = true;
    try { await fn(Object.fromEntries(new FormData(e.target))); d.close(); }
    catch (err) { $("#derr").textContent = msg(err); b.disabled = false; }
  };
}

// ---------- Actions ----------
$("#view").addEventListener("click", async e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const {a, id, p} = b.dataset, pr = projects.find(x => x.id === p), u = users.find(x => x.id === id);
  try {
    if (a === "addUser") ask("Add user", [{n: "name", l: "Name"}, {n: "email", l: "Email", t: "email"}, {n: "password", l: "Temporary password", t: "password", min: 6}, {n: "role", l: "App role", o: ["member", "manager", "admin"]}], "Add user", async v => {
      const c = await createUserWithEmailAndPassword(secAuth, v.email.trim(), v.password);
      try {
        await updateProfile(c.user, {displayName: v.name.trim()});
        await setDoc(doc(db, "users", c.user.uid), {name: v.name.trim(), email: v.email.trim(), appRole: v.role, isActive: true, createdAt: serverTimestamp()});
      } finally { await signOut(secAuth); }
      toast("User added");
    });
    else if (a === "reset") { await sendPasswordResetEmail(auth, u.email); toast("Reset email sent to " + u.email); }
    else if (a === "toggle") { await updateDoc(doc(db, "users", id), {isActive: u.isActive === false}); toast(u.isActive === false ? "User activated" : "User deactivated"); }
    else if (a === "addProject") ask("New project", [{n: "name", l: "Project name", min: 2}, {n: "description", l: "Description (optional)", opt: 1}], "Create project", async v => {
      const name = v.name.trim();
      if (projects.some(x => x.name.toLowerCase() === name.toLowerCase())) throw {message: `A project named "${name}" already exists.`};
      await addDoc(collection(db, "projects"), {name, description: (v.description || "").trim(), createdBy: me.id, members: {[me.id]: "manager"}, memberIds: [me.id], isArchived: false, createdAt: serverTimestamp()});
      toast("Project created");
    });
    else if (a === "rmMem") await updateDoc(doc(db, "projects", p), {["members." + id]: deleteField(), memberIds: arrayRemove(id)});
    else if (a === "addMem") {
      const pd = pend[p]; if (!pd || !pd.uid) return toast("Select a user to add");
      await updateDoc(doc(db, "projects", p), {["members." + pd.uid]: pd.role, memberIds: arrayUnion(pd.uid)});
      delete pend[p]; toast("Member added");
    }
    else if (a === "archive") await updateDoc(doc(db, "projects", p), {isArchived: !pr.isArchived});
  } catch (err) { toast(msg(err)); }
});

$("#view").addEventListener("change", async e => {
  const s = e.target.closest("select[data-a]"); if (!s) return;
  const {a, id, p} = s.dataset;
  try {
    if (a === "role") await updateDoc(doc(db, "users", id), {appRole: s.value});
    else if (a === "mrole") await updateDoc(doc(db, "projects", p), {["members." + id]: s.value});
    else if (a === "pickUser") pend[p] = {role: "dev", ...pend[p], uid: s.value};
    else if (a === "pickRole") pend[p] = {uid: "", ...pend[p], role: s.value};
  } catch (err) { toast(msg(err)); }
});
// "toggle" does not bubble, so listen in the capture phase
$("#view").addEventListener("toggle", e => { const d = e.target; if (d.tagName === "DETAILS") d.open ? openP.add(d.dataset.p) : openP.delete(d.dataset.p); }, true);
</script>
</body></html>
